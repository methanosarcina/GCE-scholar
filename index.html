<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholar Gallery · 学者论文画廊</title><link rel="stylesheet" href="style.css"></head>
<body><aside><a class="brand" href="./"><span class="mark">S</span> Scholar Gallery</a><p class="eyebrow">YOUR RESEARCH CIRCLE</p><h2>关注的学者 <span id="scholar-count">25</span></h2><input id="scholar-search" type="search" placeholder="搜索学者…" aria-label="搜索学者"><nav id="scholars" aria-label="学者名单"></nav><footer>一个属于你的科学文献图书馆<br><a href="https://europepmc.org" target="_blank" rel="noopener">由 Europe PMC 提供论文数据 ↗</a></footer></aside>
<main><header><span>文献图书馆 <span class="slash">/</span> <span id="breadcrumb">学者</span></span><span class="live">● 公开学术数据</span></header><section class="hero"><p class="eyebrow">EXPLORE IDEAS, VISUALLY</p><h1 id="name">Scholar Gallery</h1><p id="description">从一位科学家，发现一整个研究世界。</p><div id="lab-link" class="lab-link"></div><div class="stats"><div><strong id="loaded">—</strong><span>已载入论文</span></div><div><strong id="total">—</strong><span>ORCID 索引命中</span></div><div><strong id="figures">—</strong><span>已有论文配图</span></div></div></section>
<div class="notice" id="notice">仅显示与该学者固定 ORCID 关联的论文；未关联 ORCID 的文章不收录。真实配图区分来源，无图时提供文献封面。</div>
<section class="toolbar"><input id="paper-search" type="search" placeholder="搜索已载入的标题、摘要、期刊…" aria-label="搜索论文"><select id="year" aria-label="发表年份"><option value="">全部年份</option></select><select id="sort" aria-label="论文排序"><option value="new">最新发表</option><option value="cited">引用最多</option><option value="old">最早发表</option></select><label class="check"><input type="checkbox" id="only-images">只看真实配图</label><label class="check"><input type="checkbox" id="only-abstracts">只看摘要图</label><button id="sources" class="secondary">官网与覆盖情况</button><button id="export" class="secondary">导出 JSON ↓</button></section>
<div class="result-line"><span id="result-count" aria-live="polite">正在读取文献…</span><span id="updated"></span></div><section id="papers" class="grid" aria-label="论文画廊"></section><div class="bottom"><p id="status" role="status"></p></div></main>
<dialog id="detail"><button id="close" class="close" aria-label="关闭">×</button><div id="detail-content"></div></dialog><script src="app.js" defer></script></body></html>
