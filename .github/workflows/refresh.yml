name: Refresh catalog
on:
  push:
    branches: [main]
    paths: [collect.py]
  schedule:
    # Run once per day; the catalog keeps the exact ORCID matches and the
    # publisher-image cache is refreshed incrementally.
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python collect.py --resolved-all --figures ${{ github.event_name == 'push' && '0' || '4' }}
      - if: github.event_name != 'push'
        run: python enrich.py --all-oa
      - if: github.event_name != 'push'
        run: python publisher.py --retry
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if [ -d assets ]; then git add assets/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public literature catalog'
            git push
          fi
