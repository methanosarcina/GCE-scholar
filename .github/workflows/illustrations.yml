name: Refresh illustrations
on:
  push:
    branches: [main]
    paths: [graphics.py, publisher-feeds.json]
  workflow_dispatch:
concurrency:
  group: scholar-catalog-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  illustrations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python graphics.py --repository-limit 150 --max-seconds 600
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if [ -d assets ]; then git add assets/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh automatically discovered illustrations'
            git push
          fi
